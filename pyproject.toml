[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlint"
version = "0.1.0"
description = "A fast, dependency-light Markdown linter with a rule-per-check architecture"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
# Reference CommonMark parser used ONLY by the acceptance gate
# (tools/acceptance). Never a runtime dependency: mdlint itself stays
# dependency-light, which is why `dependencies` above is empty.
acceptance = ["markdown-it-py>=3.0"]

[project.scripts]
mdlint = "mdlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Forge ships template files containing {{placeholders}} that are not valid
# Python/TOML. Without this, `ruff check .` fails on every PR.
extend-exclude = [".company", ".claude", ".planning", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
